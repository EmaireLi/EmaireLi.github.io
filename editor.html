<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#222222" />
    <title>发布文章 · Alex</title>
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="stylesheet" href="./styles.css?v=20261017-editor-wide" />
  </head>
  <body>
    <div class="headband"></div>

    <main class="main editor-layout editor-layout-wide">
      <div class="editor-main">
        <div class="editor-page-shell">
          <h1 class="editor-page-title">发布文章</h1>

          <div id="blog-editor-mode" class="blog-editor-mode">
            <aside class="editor-pane editor-pane-left">
              <p class="editor-pane-title">工具栏</p>
              <div class="editor-tools" role="group" aria-label="文章工具栏">
                <button id="insert-image-btn" class="editor-btn secondary" type="button" aria-controls="md-input">插入图片</button>
                <p class="editor-tool-hint">按文章标题插入图片路径，文件名从 01.jpg 自动递增。</p>
              </div>
            </aside>

            <section class="editor-pane">
              <div class="editor-pane-head">
                <input id="md-title-input" class="md-title-input" type="text" placeholder="输入文章标题..." />
              </div>
              <textarea id="md-input" class="md-input" spellcheck="false"># 新文章草稿

今天写点什么？

- 记录一个想法
- 复盘一个项目
- 发布一篇博客

```js
console.log("Hello Markdown");
```
</textarea>
            </section>

            <section class="editor-pane">
              <p class="editor-pane-title">预览</p>
              <div id="md-preview" class="md-preview" aria-live="polite"></div>
            </section>
          </div>

          <section class="editor-tags" aria-labelledby="editor-tags-label">
            <label id="editor-tags-label" for="editor-tag-input">文章标签</label>
            <div id="editor-selected-tags" class="editor-selected-tags" aria-label="已选标签"></div>
            <div class="editor-tag-controls">
              <input id="editor-tag-input" type="text" placeholder="输入标签，按回车添加" aria-describedby="editor-tags-hint" />
              <button id="editor-tag-add" class="editor-btn secondary" type="button">添加</button>
              <select id="editor-tag-history" aria-label="选择历史标签" disabled>
                <option value="">正在读取历史标签…</option>
              </select>
            </div>
            <p id="editor-tags-hint">回车添加标签，点击标签上的 × 移除。保存为文章标签，不在正文中显示。</p>
            <p id="editor-tags-status" role="status" aria-live="polite"></p>
          </section>
          <div class="editor-actions">
            <button id="save-draft-btn" class="editor-btn secondary" type="button">保存草稿</button>
            <button id="save-local-btn" class="editor-btn" type="button">保存到本地</button>
            <a id="cancel-editor-btn" class="editor-btn secondary" href="./index.html#blog">返回文章</a>
          </div>
          <p id="save-status" class="publish-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© <span id="year"></span> Alex</span>
        <span class="footer-dot">•</span>
        <span>Markdown editor preserved</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="./script.js?v=20261019-markdown-draft"></script>
  </body>
</html>
